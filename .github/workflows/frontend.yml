name: frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        name: 변경 경로 판정
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(frontend/|\.github/workflows/frontend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'frontend 변경 없음 — 검증 게이트를 건너뛴다.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Vercel 빌드 이미지와 같은 메이저를 쓴다 — CI만 통과하고 배포가 깨지는 상황을 막는다.
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      # oxlint 경고는 기존값이라 통과시키고, 에러만 잡는다(CLAUDE.md 검증 게이트).
      - name: lint
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint

      - name: build
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
