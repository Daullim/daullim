name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        name: 변경 경로 판정
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(backend/|\.github/workflows/backend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'backend 변경 없음 — 검증 게이트를 건너뛴다.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 배포판·의존성·빌드 캐시. Testcontainers는 러너 내장 Docker를 그대로 쓴다.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.run == 'true'

      - name: spotlessCheck + build
        if: steps.scope.outputs.run == 'true'
        working-directory: backend
        run: ./gradlew spotlessCheck build
