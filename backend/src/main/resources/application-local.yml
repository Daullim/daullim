# 로컬 개발 — DB 접속은 spring-boot-docker-compose가 compose.yaml의 실행 중인 컨테이너에서
# 자동 발견한다(datasource를 여기 하드코딩하면 안 된다 — 모듈이 덮어쓴다).
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # 로컬 전용 더미 키(32바이트 이상). 실값은 절대 커밋하지 않는다(ADR-007 §7).
    secret: ${JWT_SECRET:daullim-local-development-only-secret-key-32b+}
  scheduling:
    # 재산입 스캔은 로컬에서 돌리지 않는다. 디버깅 시 --app.scheduling.enabled=true 로 켠다.
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
