# 로컬 개발 — datasource 하드코딩 X
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # 로컬 전용 더미 키(32바이트 이상).
    secret: ${JWT_SECRET:daullim-local-development-only-secret-key-32b+}
  scheduling:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
